<!doctype html>
<meta charset="utf-8">
<title>Claude Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Paleta blueGrey do MUI */
  :root {
    --bg-50:#eceff1; --bg-100:#cfd8dc; --bg-200:#b0bec5; --bg-300:#90a4ae; --bg-400:#78909c;
    --bg-500:#607d8b; --bg-600:#546e7a; --bg-700:#455a64; --bg-800:#37474f; --bg-900:#263238;
    --paper:#ffffff;
    --mono:'DejaVu Sans Mono', ui-monospace, Menlo, Consolas, monospace;
    --serif:'Lora', Georgia, serif;
    --sans:'Roboto', 'Liberation Sans', Helvetica, Arial, sans-serif;
    --e1:0 2px 1px -1px rgba(38,50,56,.2),0 1px 1px 0 rgba(38,50,56,.14),0 1px 3px 0 rgba(38,50,56,.12);
    --e4:0 2px 4px -1px rgba(38,50,56,.2),0 4px 5px 0 rgba(38,50,56,.14),0 1px 10px 0 rgba(38,50,56,.12);
    --e6:0 3px 5px -1px rgba(38,50,56,.2),0 6px 10px 0 rgba(38,50,56,.14),0 1px 18px 0 rgba(38,50,56,.12);
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; min-width:680px; background:var(--bg-50); color:var(--bg-800); font:14px/1.5 var(--sans); }

  /* AppBar */
  .appbar { display:flex; align-items:center; gap:12px; height:56px; padding:0 16px; background:var(--bg-800); color:#fff; box-shadow:var(--e4); border-left:6px solid var(--bg-900); }
  .appbar h1 { font:600 18px var(--serif); margin:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .appbar .kicker { font:12px var(--mono); color:var(--bg-200); }

  main { padding:16px; }
  .label { font:12px var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--bg-500); margin:0 0 8px; }

  /* Botões MUI */
  button { font:500 13px var(--sans); letter-spacing:.04em; text-transform:uppercase; border-radius:4px; cursor:pointer; transition:background .2s, box-shadow .2s, border-color .2s; }
  .btn-contained { background:var(--bg-700); color:#fff; border:0; padding:7px 18px; box-shadow:var(--e1); }
  .btn-contained:hover { background:var(--bg-900); box-shadow:var(--e4); }
  .btn-outlined { background:transparent; color:var(--bg-700); border:1px solid var(--bg-300); padding:6px 16px; }
  .btn-outlined:hover { background:rgba(69,90,100,.06); border-color:var(--bg-700); }
  .btn-text { background:transparent; color:var(--bg-700); border:0; padding:7px 10px; }
  .btn-text:hover { background:rgba(69,90,100,.08); }
  .appbar .btn-text { color:var(--bg-100); }
  .appbar .btn-text:hover { background:rgba(255,255,255,.08); color:#fff; }
  .fab { width:40px; height:40px; border-radius:50%; border:0; background:var(--bg-50); color:var(--bg-900); font:400 24px/1 var(--sans); box-shadow:var(--e6); }
  .fab:hover { background:#fff; }
  .icon-btn { width:34px; height:34px; border-radius:50%; border:0; background:transparent; color:var(--bg-500); font-size:16px; text-transform:none; }
  .icon-btn:hover { background:rgba(69,90,100,.1); color:var(--bg-900); }

  /* Lista (MUI List em Paper) */
  .list { list-style:none; margin:0; padding:0; background:var(--paper); border-radius:4px; box-shadow:var(--e1); overflow:hidden; }
  .item { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--bg-100); cursor:pointer; transition:background .15s; }
  .item:last-child { border-bottom:0; }
  .item:hover { background:var(--bg-50); }
  .item::before { content:''; width:4px; align-self:stretch; background:var(--bg-700); border-radius:2px; }
  .item .host { flex:1; font-weight:500; color:var(--bg-900); font-size:15px; }
  .item .count { font:12px var(--mono); color:var(--bg-500); }
  .item .no-perm { font:11px var(--mono); text-transform:uppercase; letter-spacing:.04em; color:var(--bg-900); background:var(--bg-100); border-radius:3px; padding:2px 6px; margin-right:auto; }
  .item::after { content:'›'; color:var(--bg-400); font-size:20px; line-height:1; }
  .empty { background:var(--paper); border-radius:4px; box-shadow:var(--e1); padding:28px 16px; text-align:center; color:var(--bg-500); margin:0; }

  /* Paper do formulário */
  .paper { background:var(--paper); border-radius:4px; box-shadow:var(--e1); padding:16px; margin-bottom:16px; }
  .rule-line { height:2px; background:var(--bg-700); margin:0 0 16px; }

  /* TextField outlined */
  .field { position:relative; }
  .field label { position:absolute; top:-8px; left:10px; padding:0 4px; background:var(--paper); font-size:12px; color:var(--bg-500); }
  input { width:100%; height:40px; padding:8px 12px; border:1px solid var(--bg-200); border-radius:4px; background:var(--paper); color:var(--bg-900); font:13px var(--mono); outline:none; transition:border-color .15s, box-shadow .15s; }
  input:hover { border-color:var(--bg-500); }
  input:focus { border-color:var(--bg-700); box-shadow:0 0 0 1px var(--bg-700); }
  input.invalid { border-color:var(--bg-900); box-shadow:0 0 0 2px var(--bg-900); background:var(--bg-50); }
  input::placeholder { color:var(--bg-300); }

  .row { display:grid; grid-template-columns:1.4fr 1.4fr 1fr 34px 34px; gap:8px; align-items:center; margin-bottom:10px; }
  .row-msg { grid-column:1 / -1; margin:-4px 0 0; font:12px var(--mono); color:var(--bg-900); }
  .row-msg.info { color:var(--bg-600); }
  .row-msg code { font:12px var(--mono); background:var(--bg-100); color:var(--bg-900); border-radius:3px; padding:1px 5px; }
  .row > * { min-width:0; }
  .labels { margin-bottom:6px; font:11px var(--mono); text-transform:uppercase; letter-spacing:.05em; color:var(--bg-500); }
  .tip { cursor:help; border-bottom:1px dotted var(--bg-500); text-transform:none; }

  .bar { display:flex; align-items:center; gap:8px; }
  .bar .spacer { flex:1; }
  #status { font-size:13px; }
  #status.err { color:var(--bg-900); font-weight:500; }
  #status.ok { color:var(--bg-600); }

  .hint { display:flex; gap:10px; margin:0; padding:10px 14px; background:var(--paper); border-left:4px solid var(--bg-700); border-radius:4px; box-shadow:var(--e1); font-size:13px; color:var(--bg-700); }
  .hint b { font:700 13px var(--mono); color:var(--bg-900); }
</style>

<!-- Listagem -->
<section id="view-list">
  <header class="appbar">
    <h1>Claude Links</h1>
    <span class="kicker" data-i18n="pagesKicker"></span>
    <button id="add-page" class="fab" data-i18n-title="addPage">+</button>
  </header>
  <main>
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" data-i18n="emptyList" hidden></p>
  </main>
</section>

<!-- Formulário de uma página -->
<section id="view-form" hidden>
  <header class="appbar">
    <button id="back" class="btn-text" data-i18n="back"></button>
    <h1 id="form-title"></h1>
  </header>
  <main>
    <div class="paper">
      <p class="label" data-i18n="pageLabel"></p>
      <div class="rule-line"></div>
      <div class="field">
        <label for="host" data-i18n="domainLabel"></label>
        <input id="host" placeholder="discord.com">
      </div>
    </div>

    <div class="paper">
      <p class="label" data-i18n="replacementsLabel"></p>
      <div class="rule-line"></div>
      <div class="row labels">
        <span data-i18n="colKey"></span>
        <span data-i18n="colValue"></span>
        <span><span data-i18n="colFolder"></span> <span class="tip" data-i18n-title="folderTip">(?)</span></span>
        <span></span>
        <span></span>
      </div>
      <div id="reps"></div>
      <button id="add-rep" class="btn-text" data-i18n="addReplacement"></button>
    </div>

    <div class="bar paper">
      <button id="del-page" class="btn-outlined" data-i18n="deletePage"></button>
      <span class="spacer"></span>
      <span id="status"></span>
      <button id="save" class="btn-contained" data-i18n="save"></button>
    </div>

    <p class="hint"><b>/</b><span data-i18n="hintSlash"></span></p>
  </main>
</section>

<template id="tpl-rep">
  <div class="row rep">
    <input class="match" data-i18n-placeholder="phKey">
    <input class="q" data-i18n-placeholder="phValue">
    <input class="folder" data-i18n-placeholder="phFolder">
    <button class="icon-btn run-rep" data-i18n-title="runTitle">▶</button>
    <button class="icon-btn del-rep" data-i18n-title="deleteRepTitle">✕</button>
    <p class="row-msg" hidden></p>
  </div>
</template>

<script src="defaults.js"></script>
<script src="options.js"></script>
